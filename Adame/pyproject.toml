[build-system]
requires = ["setuptools >= 82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "Adame"
version = "2.0.3"
description = "Adame is a tool to manage docker-applications as part in a Linux-environment."
readme = { file = "ReadMe.md", content-type = "text/markdown" }
requires-python = ">=3.10"
keywords = ["release", "build", "management"]
authors = [
    { name = "Marius Göcke", email = "marius.goecke@gmail.com" },
]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
dependencies = [
    "packaging>=25.0.0",
    "psutil>=7.2.2",
    "PyYAML>=6.0.3",
    "ScriptCollection>=4.3.27",
]

[project.urls]
Homepage = "https://github.com/anionDev/Adame"
Changelog = "https://github.com/anionDev/Adame/tree/main/Other/Resources/Changelog"

[project.scripts]
adame = "Adame.AdameCore:adame_cli"

[tool.setuptools]
zip-safe = false
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["Adame*"]
exclude = ["AdameTests*"]
